[project]
name = "log-anomaly-detection"
version = "0.1.0"
description = "Log parsing and anomaly detection for large clusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Neural next-event detectors (DeepLog LSTM and the transformer variant): uv sync --extra deep
deep = [
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Rebuild the Rust core in place while editing it: make rust-develop
rust = [
    "maturin>=1.7,<2",
]
# Reference libraries for comparison benchmarks and opt-in parity tests.
validation = [
    "drain3>=0.9.11",
    "scikit-learn>=1.5",
    "ruptures>=1.1.9",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The Rust core (rust/) is compiled into the package as `log_anomaly_detection.log_anomaly_rs`,
# so every install uses it; the Python implementation stays as the reference.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "log_anomaly_detection.log_anomaly_rs"
features = ["python"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

# CPU wheels for torch on Linux (CI and Docker); macOS wheels come from PyPI and include MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["log_anomaly_detection"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["log_anomaly_detection.log_anomaly_rs", "drain3.*", "sklearn.*", "ruptures.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q -p no:cacheprovider --basetemp=.pytest-tmp"
markers = [
    "slow: larger-scale tests",
    "validation: comparisons with reference libraries (uv sync --group validation)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
